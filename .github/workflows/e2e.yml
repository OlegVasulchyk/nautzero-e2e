name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Playwright (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          YACHT_ADMIN_PHONE: ${{ secrets.YACHT_ADMIN_PHONE }}
          YACHT_ADMIN_PASSWORD: ${{ secrets.YACHT_ADMIN_PASSWORD }}
          CARDHOLDER_PHONE: ${{ secrets.CARDHOLDER_PHONE }}
          CARDHOLDER_PASSWORD: ${{ secrets.CARDHOLDER_PASSWORD }}
          YACHT_ADMIN_CARD_PHONE: ${{ secrets.YACHT_ADMIN_CARD_PHONE }}
          YACHT_ADMIN_CARD_PASSWORD: ${{ secrets.YACHT_ADMIN_CARD_PASSWORD }}
          CARDHOLDER_PHYSICAL_PHONE: ${{ secrets.CARDHOLDER_PHYSICAL_PHONE }}
          CARDHOLDER_PHYSICAL_PASSWORD: ${{ secrets.CARDHOLDER_PHYSICAL_PASSWORD }}
          CARDHOLDER_VIRTUAL_PHONE: ${{ secrets.CARDHOLDER_VIRTUAL_PHONE }}
          CARDHOLDER_VIRTUAL_PASSWORD: ${{ secrets.CARDHOLDER_VIRTUAL_PASSWORD }}
          YACHT_MANAGER_PHONE: ${{ secrets.YACHT_MANAGER_PHONE }}
          YACHT_MANAGER_PASSWORD: ${{ secrets.YACHT_MANAGER_PASSWORD }}
          OTP_CODE: ${{ secrets.OTP_CODE }}
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
